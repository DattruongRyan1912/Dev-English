services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devenglish
      POSTGRES_USER: devenglish
      POSTGRES_PASSWORD: devenglish-local-only
    ports:
      - "5433:5432"
    volumes:
      - devenglish-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devenglish -d devenglish"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.local
    environment:
      PORT: "8080"
      DEVENGLISH_MODULES: ${DEVENGLISH_MODULES:-all}
      DATABASE_URL: postgres://devenglish:devenglish-local-only@postgres:5432/devenglish?sslmode=disable
      DEVENGLISH_SECRET_ENCRYPTION_KEY: ${DEVENGLISH_SECRET_ENCRYPTION_KEY:-}
      EMBEDDING_SIDECAR_URL: http://embedding:8090
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  embedding:
    build:
      context: ./embedding
      dockerfile: Dockerfile
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    volumes:
      - devenglish-embedding-models:/models
    ports:
      - "8090:8090"
    restart: unless-stopped

volumes:
  devenglish-postgres:
  devenglish-embedding-models:

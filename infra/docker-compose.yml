services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devenglish
      POSTGRES_USER: devenglish
      POSTGRES_PASSWORD: devenglish-local-only
    ports:
      - "5433:5432"
    volumes:
      - devenglish-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devenglish -d devenglish"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.local
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://devenglish:devenglish-local-only@postgres:5432/devenglish?sslmode=disable
      DEVENGLISH_SECRET_ENCRYPTION_KEY: ${DEVENGLISH_SECRET_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  devenglish-postgres:

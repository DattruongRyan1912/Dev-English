services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devenglish
      POSTGRES_USER: devenglish
      POSTGRES_PASSWORD: devenglish-ci
    ports:
      - "${DEVENGLISH_CI_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devenglish -d devenglish"]
      interval: 5s
      timeout: 5s
      retries: 20

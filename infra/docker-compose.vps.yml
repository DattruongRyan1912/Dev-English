# Personal VPS sidecar. Does not bind 80/443; those belong to the existing
# Caddy edge on this host. HTTP on 18090 (API) and 18091 (Flutter web).
name: devenglish

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devenglish}
      POSTGRES_USER: ${POSTGRES_USER:-devenglish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - devenglish-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: ${DEVENGLISH_BACKEND_IMAGE:-devenglish-backend:vps}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEVENGLISH_ENV: development
      DEVENGLISH_MODULES: ${DEVENGLISH_MODULES:-all}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-devenglish}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-devenglish}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18090:8080"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "18091:80"
    volumes:
      - ./web:/srv:ro
      - ./Caddyfile.web:/etc/caddy/Caddyfile:ro

volumes:
  devenglish-postgres:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - devenglish-production-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: ../.env.production
        required: false
    environment:
      DEVENGLISH_ENV: production
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: ${DEVENGLISH_PUBLIC_ORIGIN:?set DEVENGLISH_PUBLIC_ORIGIN in .env.production}
    environment:
      DEVENGLISH_DOMAIN: ${DEVENGLISH_DOMAIN:?set DEVENGLISH_DOMAIN in .env.production}
      DEVENGLISH_TLS_EMAIL: ${DEVENGLISH_TLS_EMAIL:?set DEVENGLISH_TLS_EMAIL in .env.production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - devenglish-caddy-data:/data
      - devenglish-caddy-config:/config
    restart: unless-stopped

volumes:
  devenglish-production-postgres:
  devenglish-caddy-data:
  devenglish-caddy-config:
